name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  release:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-pc-windows-msvc

      - name: Build release binary
        run: cargo build --release --locked --target x86_64-pc-windows-msvc

      - name: Stage release assets
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path dist | Out-Null
          Copy-Item -Path 'target/x86_64-pc-windows-msvc/release/shyena.exe' -Destination 'dist/shyena.exe'
          Copy-Item -LiteralPath '.shyena' -Destination 'dist/.shyena'

      - name: Generate SHA256SUMS
        shell: pwsh
        run: |
          $dist = Join-Path $pwd.Path 'dist'
          $lines = @('shyena.exe', '.shyena') | ForEach-Object {
            $hash = (Get-FileHash -Algorithm SHA256 -Path (Join-Path $dist $_)).Hash.ToLowerInvariant()
            "$hash  $_"
          }
          [IO.File]::WriteAllText(
            (Join-Path $dist 'SHA256SUMS'),
            ($lines -join "`n") + "`n",
            [Text.UTF8Encoding]::new($false)
          )

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          files: |
            dist/shyena.exe
            dist/.shyena
            dist/SHA256SUMS
