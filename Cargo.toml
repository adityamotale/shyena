[package]
name = "shyena"
version = "0.0.100"
edition = "2024"

[dependencies]
gpui = "0.2.2"
global-hotkey = "0.9.0"
async-channel = "2.3"
raw-window-handle = "0.6"
rustc-hash = "2.1"
base64 = "0.22"
windows-sys = { version = "0.61.2", features = [
    "Win32_Foundation",
    "Win32_Storage_FileSystem",
] }

[dev-dependencies]
# GPUI gates TestAppContext behind its own `test` cfg, which does not apply to
# dependencies. Enable the feature only for test builds.
gpui = { version = "0.2.2", features = ["test-support"] }

[target.'cfg(target_os = "windows")'.dependencies]
windows = { version = "0.61", features = [
    "Win32_Foundation",
    "Win32_Graphics_Dwm",
    "Win32_System_ProcessStatus",
    "Win32_System_Threading",
    "Win32_UI_Controls",
    "Win32_UI_WindowsAndMessaging",
] }

# Quality gate: pedantic is a warning so unrelated lint churn cannot block a
# build; `undocumented_unsafe_blocks` enforces a SAFETY note on every FFI call.
[lints.clippy]
pedantic = { level = "warn", priority = -1 }
undocumented_unsafe_blocks = "warn"
