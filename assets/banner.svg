<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 320" width="1200" height="320">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0b0e14" />
      <stop offset="50%" stop-color="#0f141c" />
      <stop offset="100%" stop-color="#07090d" />
    </linearGradient>

    <linearGradient id="border-glow" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#3b82f6" stop-opacity="0.6" />
      <stop offset="50%" stop-color="#10b981" stop-opacity="0.3" />
      <stop offset="100%" stop-color="#6366f1" stop-opacity="0.5" />
    </linearGradient>

    <linearGradient id="accent-text" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#60a5fa" />
      <stop offset="100%" stop-color="#34d399" />
    </linearGradient>

    <pattern id="grid" width="24" height="24" patternUnits="userSpaceOnUse">
      <circle cx="12" cy="12" r="0.75" fill="#30363d" opacity="0.45" />
    </pattern>

    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="4" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Background Base -->
  <rect width="1200" height="320" fill="url(#bg)" rx="12" />
  <rect width="1200" height="320" fill="url(#grid)" rx="12" />

  <!-- Outer Frame -->
  <rect x="1" y="1" width="1198" height="318" fill="none" stroke="url(#border-glow)" stroke-width="1.5" rx="11" opacity="0.8" />

  <!-- Left Column: Branding & Taglines -->
  <g transform="translate(64, 0)">
    <!-- Hotkey Badge -->
    <g transform="translate(0, 52)">
      <rect width="138" height="28" rx="6" fill="#1e293b" stroke="#3b82f6" stroke-width="1" opacity="0.9" />
      <text x="69" y="18" fill="#93c5fd" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="12" font-weight="600" letter-spacing="1.5" text-anchor="middle">ALT + `</text>
    </g>

    <!-- Wordmark -->
    <text x="0" y="152" fill="#f8fafc" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="76" font-weight="800" letter-spacing="-1.5">shyena</text>
    <!-- Cursor glyph -->
    <rect x="290" y="98" width="16" height="58" fill="#34d399" rx="2" filter="url(#glow)" />

    <!-- Tagline -->
    <text x="2" y="196" fill="#cbd5e1" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="20" font-weight="400">Keyboard-first launcher &amp; automation runner for Windows</text>

    <!-- Tech specs footer -->
    <g transform="translate(2, 246)">
      <text fill="#64748b" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="12.5" font-weight="500" letter-spacing="1.5">
        <tspan fill="#38bdf8">RUST 2024</tspan>
        <tspan fill="#475569">  //  </tspan>
        <tspan fill="#34d399">GPUI ENGINE</tspan>
        <tspan fill="#475569">  //  </tspan>
        <tspan fill="#a78bfa">TRANSIENT POWERSHELL</tspan>
        <tspan fill="#475569">  //  </tspan>
        <tspan fill="#f59e0b">ZERO-IDLE</tspan>
      </text>
    </g>
  </g>

  <!-- Right Column: Mockup HUD Visual -->
  <g transform="translate(680, 48)">
    <!-- Container Window -->
    <rect width="456" height="224" rx="8" fill="#090d14" stroke="#1e293b" stroke-width="1.5" />

    <!-- Titlebar / Header Line -->
    <rect width="456" height="34" rx="8" fill="#0f172a" />
    <circle cx="20" cy="17" r="4.5" fill="#ef4444" opacity="0.8" />
    <circle cx="36" cy="17" r="4.5" fill="#f59e0b" opacity="0.8" />
    <circle cx="52" cy="17" r="4.5" fill="#10b981" opacity="0.8" />
    <text x="228" y="21" fill="#64748b" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="11" text-anchor="middle" font-weight="500">shyena.exe — quick search</text>

    <!-- Search Input Box -->
    <g transform="translate(18, 48)">
      <rect width="420" height="40" rx="6" fill="#1e293b" stroke="#334155" stroke-width="1" />
      <text x="14" y="25" fill="#38bdf8" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="15" font-weight="700">#</text>
      <text x="32" y="25" fill="#f8fafc" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="14">volume 40</text>
      <rect x="114" y="11" width="8" height="18" fill="#38bdf8" opacity="0.8" />
      <rect x="340" y="8" width="66" height="24" rx="4" fill="#0f172a" stroke="#334155" stroke-width="1" />
      <text x="373" y="24" fill="#94a3b8" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="11" text-anchor="middle">Enter ↵</text>
    </g>

    <!-- Results Dropdown Rows -->
    <g transform="translate(18, 100)">
      <!-- Row 1: Selected -->
      <rect width="420" height="34" rx="5" fill="#1e293b" stroke="#3b82f6" stroke-width="1" />
      <text x="14" y="21" fill="#34d399" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="12" font-weight="600"># volume</text>
      <text x="96" y="21" fill="#94a3b8" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="11">&lt;level: 40&gt;</text>
      <text x="406" y="21" fill="#60a5fa" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="11" text-anchor="end">PowerShell</text>

      <!-- Row 2 -->
      <g transform="translate(0, 38)">
        <rect width="420" height="34" rx="5" fill="#0c131f" />
        <text x="14" y="21" fill="#94a3b8" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="12"># vol-mute</text>
        <text x="406" y="21" fill="#64748b" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="11" text-anchor="end">PowerShell</text>
      </g>

      <!-- Row 3 -->
      <g transform="translate(0, 76)">
        <rect width="420" height="34" rx="5" fill="#0c131f" />
        <text x="14" y="21" fill="#94a3b8" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="12">@ terminal</text>
        <text x="100" y="21" fill="#475569" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="11">wt.exe</text>
        <text x="406" y="21" fill="#64748b" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="11" text-anchor="end">App</text>
      </g>
    </g>
  </g>
</svg>
